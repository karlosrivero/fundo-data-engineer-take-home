[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fundo-take-home"
version = "1.0.0"
description = "Reliable incremental local pipeline for the Fundo data engineering take-home"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.3.2",
  "psycopg[binary]==3.2.9",
  "pytz==2025.2",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires the Docker Compose source database"]
